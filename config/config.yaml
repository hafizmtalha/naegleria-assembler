# Settings for the Snakemake workflow. Everything here has a sensible default,
# so a first run usually only needs the read files changing.

# --- Where the reads are ----------------------------------------------------
# Leave a list empty if you do not have that kind of read. The pipeline works
# with long reads on their own, short reads on their own, or both together.
#
# This points at the simulated set by default, so a fresh clone can run. Build
# it first, which takes a few seconds:
#
#     python scripts/make_test_data.py
#
# Then point this at your own reads. Note that read files are not kept in the
# repository, so a path here that nobody has built yet is the usual reason
# snakemake stops before it starts.
reads:
  long:
    - data/simulated/reads.fastq.gz
  short: []

# What the long reads came off. One of: ont, ont-hq, hifi, pacbio.
# ont is the older, noisier nanopore chemistry. ont-hq is the newer accurate
# kind, and picking the right one matters, because the assembler is told to
# expect a different error rate.
read_type: ont

# --- Sorting reads into compartments ----------------------------------------
triage:
  # k-mer length. 21 is a good default. Drop it to 15 if the reads are very
  # noisy, since one error anywhere in a k-mer destroys it and a shorter k-mer
  # is destroyed less often.
  k: 21

  # Keep about one k-mer in this many when counting. This is the memory knob,
  # and it is also the setting most likely to give you a wrong answer, so it is
  # worth reading this before changing it.
  #
  # A high number keeps fewer k-mers and uses less memory. The catch is that
  # each read then contributes only a few dozen sampled k-mers, and if the reads
  # are noisy most of those carry an error and get thrown away. That leaves too
  # few to take a median of, and the compartments stop separating. On real
  # nanopore data a setting of 100 produced nonsense and 20 fixed it.
  #
  # So 20 is the default here, because noisy long reads are the common case and
  # the simulated data this config points at has a 6 percent error rate. Raise
  # it to 100 if your reads are accurate, such as HiFi, or if memory is tight
  # and you have checked the depth plot still shows clean humps.
  scale: 20

  # How much a hump has to stand out from its surroundings to count as a
  # compartment, in log10 units. 0.15 means about one and a half fold. Lower
  # finds more compartments and more noise.
  min_prominence: 0.15

# --- The small circles ------------------------------------------------------
circles:
  # How deeply to cover each element before assembling it. There is no gain in
  # throwing two thousand fold coverage at a fifteen kilobase circle.
  target_depth: 60

  # k-mer length for finding overlaps between reads. Shorter than the triage k
  # on purpose, because here we need overlaps to be found on noisy reads rather
  # than depths to be measured precisely.
  k: 15

  # The most high copy compartments to try to assemble.
  max_elements: 4

# --- The nuclear assembly ---------------------------------------------------
nuclear:
  # auto picks Flye for long reads and SPAdes for short ones. nagasm uses the
  # assembler in this package, which is there to be read rather than to beat a
  # mature tool.
  engine: auto

  # Leave empty to work it out from which read files were given. Otherwise one
  # of: long, short, hybrid, long_then_polish.
  mode: ""

  # Contigs shorter than this are dropped.
  min_contig_bp: 500

# --- Polishing --------------------------------------------------------------
polish:
  rounds: 2

# --- Gene content, optional --------------------------------------------------
# Off by default. BUSCO is not in environment.yml, and it downloads its lineage
# the first time it runs, which is the only step here that needs the network.
# Install it with environment-busco.yml. See the README.
busco:
  # A BUSCO lineage name, for example eukaryota_odb10. Leave empty to skip the
  # check entirely. Only the nuclear contigs are ever scored, on purpose.
  lineage: ""

  # A folder that already holds the lineage, which runs BUSCO offline. Leave
  # empty to let it download.
  download_path: ""

# --- Resources --------------------------------------------------------------
threads: 8
memory_gb: 12

outdir: results
