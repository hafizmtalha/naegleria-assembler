[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nagasm"
version = "0.1.0"
description = "An assembly pipeline built around the way Naegleria keeps its DNA"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hafiz Muhammad Talha" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
nagasm = "nagasm.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "nagasm.nagcore"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
